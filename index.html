<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="calculator-app">
    
    <!-- SIDEBAR NAVIGATION -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="closeBtn" class="close-btn">✕</button>
        <h2>Calculator</h2>
      </div>
      <ul class="nav-links">
        <li class="active" data-mode="Standard"><span class="icon">🔢</span> Standard</li>
        <li data-mode="Scientific"><span class="icon">🧪</span> Scientific</li>
        <li data-mode="Date"><span class="icon">📅</span> Date Calculation</li>
        <hr>
        <li class="header">Converter</li>
        <li data-mode="Volume"><span class="icon">📦</span> Volume</li>
        <li data-mode="Length"><span class="icon">📏</span> Length</li>
        <li data-mode="Weight"><span class="icon">⚖️</span> Weight and mass</li>
        <li data-mode="Temperature"><span class="icon">🌡️</span> Temperature</li>
        <li data-mode="Energy"><span class="icon">🔥</span> Energy</li>
        <li data-mode="Area"><span class="icon">🔲</span> Area</li>
        <li data-mode="Speed"><span class="icon">🏃</span> Speed</li>
        <li data-mode="Time"><span class="icon">⏱️</span> Time</li>
      </ul>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- MAIN CALCULATOR AREA -->
    <div class="calculator-main">
      
      <div class="header">
        <button id="menuBtn" class="menu-btn">☰</button>
        <h1 class="title" id="modeTitle">Standard</h1>
      </div>

      <!-- ================= 1. STANDARD MODE ================= -->
      <div id="mode-Standard" class="mode-container active-mode">
        <div class="display-area">
          <div class="history-display" id="std-history"></div>
          <div class="main-display" id="std-display">0</div>
        </div>
        <div class="keypad">
          <button class="key func" data-action="percent">%</button>
          <button class="key func" data-action="ce">CE</button>
          <button class="key func" data-action="clear">C</button>
          <button class="key func" data-action="delete">⌫</button>

          <button class="key func" data-action="reciprocal">¹/x</button>
          <button class="key func" data-action="square">x²</button>
          <button class="key func" data-action="sqrt">²√x</button>
          <button class="key op" data-op="/">÷</button>

          <button class="key num" data-num="7">7</button>
          <button class="key num" data-num="8">8</button>
          <button class="key num" data-num="9">9</button>
          <button class="key op" data-op="*">×</button>

          <button class="key num" data-num="4">4</button>
          <button class="key num" data-num="5">5</button>
          <button class="key num" data-num="6">6</button>
          <button class="key op" data-op="-">−</button>

          <button class="key num" data-num="1">1</button>
          <button class="key num" data-num="2">2</button>
          <button class="key num" data-num="3">3</button>
          <button class="key op" data-op="+">+</button>

          <button class="key func" data-action="negate">+/−</button>
          <button class="key num" data-num="0">0</button>
          <button class="key num" data-num=".">.</button>
          <button class="key equals" data-action="equals">=</button>
        </div>
      </div>

      <!-- ================= 2. SCIENTIFIC MODE ================= -->
      <div id="mode-Scientific" class="mode-container">
        <div class="display-area">
          <div class="history-display" id="sci-history"></div>
          <div class="main-display" id="sci-display">0</div>
        </div>
        <div class="keypad sci-keypad">
          <button class="key func" data-sci="sin">sin</button>
          <button class="key func" data-sci="cos">cos</button>
          <button class="key func" data-sci="tan">tan</button>
          <button class="key func" data-action="clear">C</button>
          
          <button class="key func" data-sci="log">log</button>
          <button class="key func" data-sci="ln">ln</button>
          <button class="key func" data-sci="pi">π</button>
          <button class="key func" data-action="delete">⌫</button>

          <button class="key func" data-sci="sqrt">²√x</button>
          <button class="key func" data-sci="square">x²</button>
          <button class="key func" data-sci="pow">x^y</button>
          <button class="key op" data-op="/">÷</button>

          <button class="key num" data-num="7">7</button>
          <button class="key num" data-num="8">8</button>
          <button class="key num" data-num="9">9</button>
          <button class="key op" data-op="*">×</button>

          <button class="key num" data-num="4">4</button>
          <button class="key num" data-num="5">5</button>
          <button class="key num" data-num="6">6</button>
          <button class="key op" data-op="-">−</button>

          <button class="key num" data-num="1">1</button>
          <button class="key num" data-num="2">2</button>
          <button class="key num" data-num="3">3</button>
          <button class="key op" data-op="+">+</button>

          <button class="key func" data-action="negate">+/−</button>
          <button class="key num" data-num="0">0</button>
          <button class="key num" data-num=".">.</button>
          <button class="key equals" data-action="equals">=</button>
        </div>
      </div>

      <!-- ================= 3. CONVERTER MODE ================= -->
      <div id="mode-Converter" class="mode-container">
        <div class="display-area converter-display">
          <div class="conv-input-group">
            <input type="number" id="conv-input" value="1" />
            <select id="conv-from"></select>
          </div>
          <div class="conv-equals">=</div>
          <div class="conv-input-group">
            <input type="text" id="conv-output" value="0" readonly />
            <select id="conv-to"></select>
          </div>
        </div>
      </div>

      <!-- ================= 4. DATE CALCULATION MODE ================= -->
      <div id="mode-Date" class="mode-container">
        <div class="display-area date-display">
          <label>From Date:</label>
          <input type="date" id="date-from" />
          <label>To Date:</label>
          <input type="date" id="date-to" />
          <button class="btn-primary" id="calc-date-btn">Calculate Difference</button>
          <div id="date-result" class="result-text">0 Days</div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
